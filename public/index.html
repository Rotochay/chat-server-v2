<!DOCTYPE html>
<html lang="en" data-theme="pop">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Chat Server</title>

  <meta
    name="description"
    content="A private chat room for three people."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ============ LOGIN ============ -->

  <main
    id="login"
    class="screen login"
  >

    <div
      class="login-shapes"
      aria-hidden="true"
    >
      <span class="shape shape-flag"></span>
      <span class="shape shape-dot"></span>
      <span class="shape shape-bar"></span>
    </div>

    <div class="login-inner">

      <p class="kicker">
        PRIVATE // 3 PEOPLE ONLY
      </p>

      <h1 class="mega">
        CHAT<br>SERVER
      </h1>

      <p class="ask">
        WHO ARE YOU?
      </p>

      <div
        class="cards"
        role="radiogroup"
        aria-label="Choose your account"
      >

        <button
          type="button"
          class="card card-aayush"
          data-user="aayush"
          role="radio"
          aria-checked="false"
        >
          <span class="card-letter">A</span>
          <span class="card-name">Aayush</span>
        </button>

        <button
          type="button"
          class="card card-hari"
          data-user="hari"
          role="radio"
          aria-checked="false"
        >
          <span class="card-letter">H</span>
          <span class="card-name">Hari</span>
        </button>

        <button
          type="button"
          class="card card-aditya"
          data-user="aditya"
          role="radio"
          aria-checked="false"
        >
          <span class="card-letter">A</span>
          <span class="card-name">Aditya</span>
        </button>

      </div>

      <form
        id="loginForm"
        class="login-form"
        autocomplete="off"
      >

        <label
          class="field-label"
          for="passwordInput"
        >
          PASSWORD
        </label>

        <div class="field-row">

          <input
            id="passwordInput"
            name="password"
            type="password"
            autocomplete="off"
            placeholder="••••••••"
            required
          >

          <button
            type="submit"
            class="enter-btn"
          >
            ENTER
            <span aria-hidden="true">→</span>
          </button>

        </div>

        <p
          id="loginError"
          class="login-error"
          role="alert"
          hidden
        ></p>

      </form>

    </div>
  </main>


  <!-- ============ CHAT ============ -->

  <div
    id="chat"
    class="screen chat hidden"
  >

    <header class="topbar">

      <div class="brand">

        <span
          class="brand-mark"
          aria-hidden="true"
        >
          ✳
        </span>

        <span class="brand-name">
          CHAT SERVER
        </span>

      </div>

      <div
        id="status"
        class="status offline"
      >

        <span
          class="status-dot"
          aria-hidden="true"
        ></span>

        <span id="statusText">
          OFFLINE
        </span>

      </div>

      <ul
        id="members"
        class="members"
        aria-label="Members"
      ></ul>

      <button
        id="settingsBtn"
        type="button"
        class="icon-btn"
        aria-label="Settings"
        aria-expanded="false"
      >
        ⚙
      </button>

      <button
        id="logoutBtn"
        type="button"
        class="icon-btn"
        aria-label="Log out"
      >
        ⏻
      </button>

    </header>


    <main
      id="messages"
      class="messages"
      aria-live="polite"
    ></main>


    <form
      id="composer"
      class="composer"
      autocomplete="off"
    >

      <input
        id="messageInput"
        type="text"
        maxlength="2000"
        autocomplete="off"
        aria-label="Message"
        placeholder="Message..."
      >

      <button
        type="submit"
        class="send-btn"
      >
        SEND
        <span aria-hidden="true">➤</span>
      </button>

    </form>

  </div>


  <!-- ============ SETTINGS OVERLAY ============ -->

  <div
    id="settingsOverlay"
    class="overlay hidden"
  ></div>


  <!-- ============ SETTINGS ============ -->

  <aside
    id="settings"
    class="settings hidden"
    role="dialog"
    aria-modal="true"
    aria-label="Settings"
  >

    <div class="settings-head">

      <h2>SETTINGS</h2>

      <button
        id="settingsClose"
        type="button"
        class="icon-btn"
        aria-label="Close settings"
      >
        ×
      </button>

    </div>


    <section class="settings-block">

      <h3>APPEARANCE</h3>

      <div
        class="theme-list"
        role="radiogroup"
        aria-label="Theme"
      >

        <button
          type="button"
          class="theme-opt"
          data-theme-value="pop"
          role="radio"
          aria-checked="true"
        >
          <span
            class="radio"
            aria-hidden="true"
          ></span>

          Pop
        </button>

        <button
          type="button"
          class="theme-opt"
          data-theme-value="glass"
          role="radio"
          aria-checked="false"
        >
          <span
            class="radio"
            aria-hidden="true"
          ></span>

          Liquid Glass
        </button>

        <button
          type="button"
          class="theme-opt"
          data-theme-value="matrix"
          role="radio"
          aria-checked="false"
        >
          <span
            class="radio"
            aria-hidden="true"
          ></span>

          Matrix
        </button>

      </div>

    </section>


    <hr class="settings-rule">


    <section class="settings-block">

      <h3>CHAT</h3>

      <button
        type="button"
        class="toggle-row"
        data-setting="grouping"
        aria-pressed="true"
      >
        <span>
          Message grouping
        </span>

        <span class="toggle-state">
          ON
        </span>
      </button>

      <button
        type="button"
        class="toggle-row"
        data-setting="timestamps"
        aria-pressed="true"
      >
        <span>
          Timestamps
        </span>

        <span class="toggle-state">
          ON
        </span>
      </button>

    </section>


    <!-- ============ ADMIN WIPE ============ -->

    <section
      id="wipeSection"
      class="settings-block wipe-section hidden"
    >

      <h3>DANGER ZONE</h3>

      <button
        id="wipeBtn"
        type="button"
        class="wipe-btn"
      >
        <span>WIPE CHAT</span>
        <span aria-hidden="true">⌫</span>
      </button>

      <p class="wipe-note">
        Permanently deletes every saved message.
      </p>

    </section>

  </aside>


  <!-- ============ WIPE MODAL ============ -->

  <div
    id="wipeModal"
    class="modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="wipeTitle"
  >

    <div class="modal-card">

      <div
        class="modal-mark"
        aria-hidden="true"
      >
        !
      </div>

      <h2 id="wipeTitle">
        WIPE ENTIRE CHAT?
      </h2>

      <p>
        This permanently deletes every
        message from the server.
        This cannot be undone.
      </p>

      <label
        class="field-label"
        for="wipePassword"
      >
        ADMIN PASSWORD
      </label>

      <input
        id="wipePassword"
        type="password"
        autocomplete="off"
        placeholder="••••••••"
      >

      <p
        id="wipeError"
        class="login-error"
        role="alert"
        hidden
      ></p>

      <div class="modal-actions">

        <button
          id="wipeCancel"
          type="button"
          class="modal-cancel"
        >
          CANCEL
        </button>

        <button
          id="wipeConfirm"
          type="button"
          class="modal-danger"
        >
          WIPE EVERYTHING
        </button>

      </div>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
